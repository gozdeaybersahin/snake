<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding - Yılan Oyunu</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 50px;
        }
        #gameBoard {
            background-color: #34495e;
            border: 4px solid #1abc9c;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(26, 188, 156, 0.5);
        }
        .score-board {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #restartBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }
        #restartBtn:hover {
            background-color: #16a085;
            transform: scale(1.05);
        }
        #restartBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="score-board">Skor: <span id="scoreText">0</span></div>
    <canvas id="gameBoard" width="400" height="400"></canvas>
    <button id="restartBtn" onclick="resetGame()">Yeniden Başlat</button>

    <script>
        const canvas = document.getElementById("gameBoard");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");

        const boardBackground = "#34495e";
        const snakeColor = "#2ecc71";
        const snakeBorder = "#27ae60";
        const foodColor = "#e74c3c";
        const unitSize = 20;

        let running = false;
        let xVelocity = unitSize;
        let yVelocity = 0;
        let foodX;
        let foodY;
        let score = 0;
        let snake = [
            {x: unitSize * 4, y: 0},
            {x: unitSize * 3, y: 0},
            {x: unitSize * 2, y: 0},
            {x: unitSize, y: 0},
            {x: 0, y: 0}
        ];

        window.addEventListener("keydown", changeDirection);
        
        gameStart();

        function gameStart() {
            running = true;
            scoreText.textContent = score;
            createFood();
            drawFood();
            nextTick();
        };

        function nextTick() {
            if(running) {
                setTimeout(() => {
                    clearBoard();
                    drawFood();
                    moveSnake();
                    drawSnake();
                    checkGameOver();
                    nextTick();
                }, 100); // Yılanın hızını belirleyen süre (milisaniye)
            } else {
                displayGameOver();
            }
        };

        function clearBoard() {
            ctx.fillStyle = boardBackground;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };

        function createFood() {
            function randomFood(min, max) {
                const randNum = Math.round((Math.random() * (max - min) + min) / unitSize) * unitSize;
                return randNum;
            }
            foodX = randomFood(0, canvas.width - unitSize);
            foodY = randomFood(0, canvas.height - unitSize);
        };

        function drawFood() {
            ctx.fillStyle = foodColor;
            ctx.fillRect(foodX, foodY, unitSize, unitSize);
        };

        function moveSnake() {
            const head = {x: snake[0].x + xVelocity, y: snake[0].y + yVelocity};
            snake.unshift(head); // Yılanın başına yeni kare ekle
            
            // Yem yendi mi kontrolü
            if(snake[0].x == foodX && snake[0].y == foodY) {
                score += 10;
                scoreText.textContent = score;
                createFood();
            } else {
                snake.pop(); // Yem yenmediyse kuyruktan sil
            }
        };

        function drawSnake() {
            ctx.fillStyle = snakeColor;
            ctx.strokeStyle = snakeBorder;
            snake.forEach(snakePart => {
                ctx.fillRect(snakePart.x, snakePart.y, unitSize, unitSize);
                ctx.strokeRect(snakePart.x, snakePart.y, unitSize, unitSize);
            });
        };

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;

            const goingUp = (yVelocity == -unitSize);
            const goingDown = (yVelocity == unitSize);
            const goingRight = (xVelocity == unitSize);
            const goingLeft = (xVelocity == -unitSize);

            if(keyPressed == LEFT && !goingRight) { xVelocity = -unitSize; yVelocity = 0; }
            if(keyPressed == UP && !goingDown) { xVelocity = 0; yVelocity = -unitSize; }
            if(keyPressed == RIGHT && !goingLeft) { xVelocity = unitSize; yVelocity = 0; }
            if(keyPressed == DOWN && !goingUp) { xVelocity = 0; yVelocity = unitSize; }
            
            // Ok tuşlarının tarayıcı sayfasını kaydırmasını engelle
            if([37, 38, 39, 40].includes(keyPressed)) {
                event.preventDefault();
            }
        };

        function checkGameOver() {
            // Duvara çarpma kontrolü
            switch(true) {
                case (snake[0].x < 0):
                case (snake[0].x >= canvas.width):
                case (snake[0].y < 0):
                case (snake[0].y >= canvas.height):
                    running = false;
                    break;
            }
            // Kendi kuyruğuna çarpma kontrolü
            for(let i = 1; i < snake.length; i+=1) {
                if(snake[i].x == snake[0].x && snake[i].y == snake[0].y) {
                    running = false;
                }
            }
        };

        function displayGameOver() {
            ctx.font = "40px 'Segoe UI'";
            ctx.fillStyle = "#e74c3c";
            ctx.textAlign = "center";
            ctx.fillText("OYUN BİTTİ!", canvas.width / 2, canvas.height / 2);
            running = false;
        };

        function resetGame() {
            score = 0;
            xVelocity = unitSize;
            yVelocity = 0;
            snake = [
                {x: unitSize * 4, y: 0},
                {x: unitSize * 3, y: 0},
                {x: unitSize * 2, y: 0},
                {x: unitSize, y: 0},
                {x: 0, y: 0}
            ];
            gameStart();
        };
    </script>
</body>
</html>
