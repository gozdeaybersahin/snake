<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gözde - Snake</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at center, #0a1122 0%, #000205 100%), 
                        linear-gradient(180deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: cover, 100% 3px; 
            color: #00ffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-top: 20px;
            min-height: 100vh;
            touch-action: none; 
            overflow: hidden; 
            -webkit-user-select: none;
            user-select: none;
        }

        .header-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .score-card {
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 8px; 
            border: 1px solid rgba(0, 255, 255, 0.3); 
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.3s ease;
        }
        .score-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #66e6e6;
            margin-bottom: 5px;
        }
        .score-value {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc; 
            text-shadow: 0 0 10px #00ffcc;
        }
        .record-value {
            color: #ff007f; 
            text-shadow: 0 0 10px #ff007f;
        }

        .stats-card {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 18px;
            border-radius: 4px; 
            font-size: 13px;
            color: #ffd700;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            text-shadow: 0 0 5px #ffd700;
        }

        #gameBoard {
            background-color: #010103;
            border: 2px solid #00ffcc;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5), 
                        0 0 40px rgba(0, 255, 204, 0.2), 
                        inset 0 0 20px rgba(0,0,0,0.9);
            max-width: 90vw;
            max-height: 90vw;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-primary {
            padding: 12px 28px;
            font-size: 15px;
            background: linear-gradient(135deg, #00ffcc 0%, #008f8f 100%);
            color: #010103;
            border: none;
            border-radius: 4px; 
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }
        .btn-primary:active {
            transform: scale(0.96) translateY(2px);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        #restartBtn {
            background: linear-gradient(135deg, #ff0055 0%, #a00030 100%);
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            display: none;
        }

        .mobile-hint {
            margin-top: 20px;
            color: #66e6e6;
            font-size: 14px;
            text-align: center;
            opacity: 0.7;
        }

        @media (min-width: 768px) {
            body { padding-top: 40px; }
            .mobile-hint { display: none; }
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="score-card">
            <div class="score-label">Skor</div>
            <div class="score-value" id="scoreText">0</div>
        </div>
        <div class="score-card">
            <div class="score-label">Rekor</div>
            <div class="score-value record-value" id="highScoreText">0</div>
        </div>
    </div>
    
    <div class="stats-card">
        Sıradaki Yem: <span id="pointsText">1</span> Puan
    </div>
    
    <canvas id="gameBoard" width="400" height="400"></canvas>
    
    <div class="mobile-hint">Yönlendirmek için ekranda parmağınızı kaydırın 👆</div>

    <div class="controls">
        <button id="startBtn" class="btn-primary">Oyuna Başla</button>
        <button id="restartBtn" class="btn-primary">Yeniden Başlat</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById("gameBoard");
            const ctx = canvas.getContext("2d");
            const scoreText = document.getElementById("scoreText");
            const highScoreText = document.getElementById("highScoreText");
            const pointsText = document.getElementById("pointsText");
            const startBtn = document.getElementById("startBtn");
            const restartBtn = document.getElementById("restartBtn");

            const boardBackground = "#010103";
            const gridColor = "rgba(0, 255, 255, 0.02)";
            const snakeHeadColor = "#ffffff";
            const snakeBodyColor = "#00ffcc";
            const foodColor = "#ff007f";
            const goldenFoodColor = "#ffd700"; 
            const unitSize = 20;

            let running = false;
            const baseSpeed = 250; 
            const minSpeed = 50;   
            const speedStep = 10;  
            let gameSpeed = baseSpeed; 
            
            let xVelocity = unitSize;
            let yVelocity = 0;
            let foodX, foodY;
            let score = 0;
            let highScore = 0;
            let goldenFood = null; 

            // Ses Motoru
            let audioCtx;
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playSound(type) {
                if (!audioCtx) return;
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'eat') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'golden') {
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(1500, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'die') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.5);
                }
            }

            try {
                if (window.localStorage) {
                    highScore = localStorage.getItem("snakeHighScore") || 0; 
                }
            } catch (error) {}

            let snake = [
                {x: unitSize * 4, y: 0},
                {x: unitSize * 3, y: 0},
                {x: unitSize * 2, y: 0},
                {x: unitSize, y: 0},
                {x: 0, y: 0}
            ];

            startBtn.addEventListener("click", startGame);
            restartBtn.addEventListener("click", resetGame);
            
            // Klavye Yön Tuşları (PC için)
            window.addEventListener("keydown", (e) => { initAudio(); changeDirection(e); });
            
            // --- EKSTRA HASSAS KAYDIRMA (SWIPE) KONTROLLERİ ---
            let touchStartX = null;
            let touchStartY = null;
            
            // Eşik değeri 10'dan 5'e düşürüldü. Çok küçük bir dokunuş bile hareketi tetikleyecek.
            const swipeThreshold = 5; 

            document.addEventListener('touchstart', function(e) {
                if(e.target.tagName !== 'BUTTON') {
                    touchStartX = e.touches[0].screenX;
                    touchStartY = e.touches[0].screenY;
                    initAudio(); 
                }
            }, { passive: true });

            document.addEventListener('touchmove', function(e) {
                if(e.target.tagName !== 'BUTTON' && touchStartX !== null && touchStartY !== null) {
                    let touchCurrentX = e.touches[0].screenX;
                    let touchCurrentY = e.touches[0].screenY;
                    
                    let deltaX = touchCurrentX - touchStartX;
                    let deltaY = touchCurrentY - touchStartY;
                    
                    if (Math.abs(deltaX) > swipeThreshold || Math.abs(deltaY) > swipeThreshold) {
                        if (Math.abs(deltaX) > Math.abs(deltaY)) {
                            if (deltaX > 0) setDirection('RIGHT');
                            else setDirection('LEFT');
                        } else {
                            if (deltaY > 0) setDirection('DOWN');
                            else setDirection('UP');
                        }
                        
                        if (navigator.vibrate) navigator.vibrate(10); 
                        
                        touchStartX = touchCurrentX;
                        touchStartY = touchCurrentY;
                    }
                }
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                touchStartX = null;
                touchStartY = null;
            }, { passive: true });
            
            initGame();

            function initGame() {
                highScoreText.textContent = highScore;
                clearBoard();
                ctx.font = "bold 22px 'Segoe UI'";
                ctx.fillStyle = "#00ffcc";
                ctx.textAlign = "center";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00ffcc";
                ctx.fillText("HAZIR MISIN?", canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = "16px 'Segoe UI'";
                ctx.fillStyle = "#66e6e6";
                ctx.shadowBlur = 0;
                ctx.fillText("Başlamak için butona bas", canvas.width / 2, canvas.height / 2 + 20);
            }

            function startGame() {
                initAudio();
                if(running) return;
                startBtn.style.display = "none";
                restartBtn.style.display = "none";
                document.querySelector('.mobile-hint').style.display = "none";
                running = true;
                scoreText.textContent = score;
                updatePointsUI();
                createFood();
                nextTick();
            }

            function nextTick() {
                if(running) {
                    setTimeout(() => {
                        clearBoard();
                        drawFood();
                        drawGoldenFood();
                        moveSnake();
                        drawSnake();
                        checkGameOver();
                        nextTick();
                    }, gameSpeed); 
                } else {
                    displayGameOver();
                }
            };

            function clearBoard() {
                ctx.fillStyle = boardBackground;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 1;
                for(let i = 0; i < canvas.width; i+=unitSize) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                }
                for(let i = 0; i < canvas.height; i+=unitSize) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }
            };

            function createFood() {
                function randomFood(min, max) { return Math.round((Math.random() * (max - min) + min) / unitSize) * unitSize; }
                let foodIsOnSnake = true;
                while(foodIsOnSnake) {
                    foodX = randomFood(0, canvas.width - unitSize);
                    foodY = randomFood(0, canvas.height - unitSize);
                    let onGolden = goldenFood ? (goldenFood.x === foodX && goldenFood.y === foodY) : false;
                    foodIsOnSnake = snake.some(snakePart => snakePart.x === foodX && snakePart.y === foodY) || onGolden;
                }
            };

            function spawnGoldenFood() {
                function randomFood(min, max) { return Math.round((Math.random() * (max - min) + min) / unitSize) * unitSize; }
                let validPos = false;
                let gX, gY;
                while(!validPos) {
                    gX = randomFood(0, canvas.width - unitSize);
                    gY = randomFood(0, canvas.height - unitSize);
                    let onSnake = snake.some(snakePart => snakePart.x === gX && snakePart.y === gY);
                    let onNormalFood = (gX === foodX && gY === foodY);
                    if(!onSnake && !onNormalFood) validPos = true;
                }
                let timeoutId = setTimeout(() => { goldenFood = null; }, 7000);
                goldenFood = { x: gX, y: gY, timeout: timeoutId };
            }

            function drawFood() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = foodColor;
                ctx.fillStyle = foodColor;
                ctx.fillRect(foodX + 2, foodY + 2, unitSize - 4, unitSize - 4);
                ctx.shadowBlur = 0; 
            };

            function drawGoldenFood() {
                if (goldenFood) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = goldenFoodColor;
                    ctx.fillStyle = goldenFoodColor;
                    ctx.fillRect(goldenFood.x + 2, goldenFood.y + 2, unitSize - 4, unitSize - 4);
                    ctx.shadowBlur = 0; 
                }
            }
            
            function calculateCurrentPoints() { return Math.floor((baseSpeed - gameSpeed) / speedStep) + 1; }
            function updatePointsUI() { pointsText.textContent = calculateCurrentPoints(); }

            function moveSnake() {
                let newX = snake[0].x + xVelocity;
                let newY = snake[0].y + yVelocity;

                if (newX < 0) newX = canvas.width - unitSize;
                else if (newX >= canvas.width) newX = 0;
                if (newY < 0) newY = canvas.height - unitSize;
                else if (newY >= canvas.height) newY = 0;

                const head = {x: newX, y: newY};
                snake.unshift(head);
                
                if(snake[0].x == foodX && snake[0].y == foodY) {
                    playSound('eat');
                    score += calculateCurrentPoints();
                    if(gameSpeed > minSpeed) gameSpeed -= speedStep;
                    updatePointsUI(); checkHighScore(); createFood();
                    if(!goldenFood && Math.random() < 0.20) spawnGoldenFood();
                } 
                else if (goldenFood && snake[0].x == goldenFood.x && snake[0].y == goldenFood.y) {
                    playSound('golden');
                    score += (calculateCurrentPoints() * 5); 
                    gameSpeed = Math.min(baseSpeed, gameSpeed + 30);
                    updatePointsUI(); checkHighScore();
                    clearTimeout(goldenFood.timeout); 
                    goldenFood = null; 
                } 
                else { snake.pop(); }
            };

            function checkHighScore() {
                scoreText.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreText.textContent = highScore;
                    try { if (window.localStorage) localStorage.setItem("snakeHighScore", highScore); } catch (error) {}
                }
            }

            function drawSnake() {
                snake.forEach((snakePart, index) => {
                    ctx.fillStyle = index === 0 ? snakeHeadColor : snakeBodyColor;
                    
                    if(index === 0) {
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = snakeBodyColor;
                    } else {
                        ctx.shadowBlur = 0;
                    }
                    
                    ctx.fillRect(snakePart.x + 1, snakePart.y + 1, unitSize - 2, unitSize - 2);
                });
                ctx.shadowBlur = 0; 
            };

            function setDirection(direction) {
                const goingUp = (yVelocity == -unitSize);
                const goingDown = (yVelocity == unitSize);
                const goingRight = (xVelocity == unitSize);
                const goingLeft = (xVelocity == -unitSize);

                if(direction == 'LEFT' && !goingRight) { xVelocity = -unitSize; yVelocity = 0; }
                if(direction == 'UP' && !goingDown) { xVelocity = 0; yVelocity = -unitSize; }
                if(direction == 'RIGHT' && !goingLeft) { xVelocity = unitSize; yVelocity = 0; }
                if(direction == 'DOWN' && !goingUp) { xVelocity = 0; yVelocity = unitSize; }
            }

            function changeDirection(event) {
                const keyPressed = event.keyCode;
                if(keyPressed == 37 || keyPressed == 65) setDirection('LEFT');   
                if(keyPressed == 38 || keyPressed == 87) setDirection('UP');     
                if(keyPressed == 39 || keyPressed == 68) setDirection('RIGHT');  
                if(keyPressed == 40 || keyPressed == 83) setDirection('DOWN');   
                if([37, 38, 39, 40].includes(keyPressed)) event.preventDefault(); 
            };

            function checkGameOver() {
                for(let i = 1; i < snake.length; i+=1) {
                    if(snake[i].x == snake[0].x && snake[i].y == snake[0].y) {
                        playSound('die');
                        running = false;
                    }
                }
            };

            function displayGameOver() {
                ctx.font = "bold 35px 'Segoe UI'";
                ctx.fillStyle = "#ff007f";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff007f";
                ctx.fillText("OYUN BİTTİ!", canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
                restartBtn.style.display = "block"; 
                running = false;
            };

            function resetGame() {
                score = 0;
                gameSpeed = baseSpeed; 
                xVelocity = unitSize;
                yVelocity = 0;
                if(goldenFood) { clearTimeout(goldenFood.timeout); goldenFood = null; }
                snake = [
                    {x: unitSize * 4, y: 0},
                    {x: unitSize * 3, y: 0},
                    {x: unitSize * 2, y: 0},
                    {x: unitSize, y: 0},
                    {x: 0, y: 0}
                ];
                startGame();
            };
        });
    </script>
</body>
</html>
