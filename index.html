<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gözde - Snake</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 20px;
            touch-action: manipulation; 
        }
        #gameBoard {
            background-color: #34495e;
            border: 4px solid #1abc9c;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(26, 188, 156, 0.5);
            max-width: 90vw;
            max-height: 90vw;
        }
        .score-container {
            display: flex;
            gap: 20px;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .stats {
            font-size: 14px;
            color: #bdc3c7;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .btn-primary {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        #restartBtn {
            background-color: #e74c3c;
            display: none;
        }
        
        /* Mobil Kontrol Butonları (D-Pad) */
        .d-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }
        .horizontal-btns {
            display: flex;
            gap: 60px;
        }
        .d-pad button {
            width: 60px;
            height: 60px;
            font-size: 24px;
            border-radius: 50%;
            border: none;
            background-color: #34495e;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .d-pad button:active {
            background-color: #1abc9c;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Bilgisayar Ekranlarında (Genişlik 768px ve üzeri) Mobil Butonları Gizle */
        @media (min-width: 768px) {
            .d-pad {
                display: none;
            }
            body {
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="score-container">
        <div>Skor: <span id="scoreText">0</span></div>
        <div>Rekor: <span id="highScoreText">0</span></div>
    </div>
    
    <div class="stats">
        Sıradaki Yem: <span id="pointsText">1</span> Puan
    </div>
    
    <canvas id="gameBoard" width="400" height="400"></canvas>
    
    <div class="controls">
        <button id="startBtn" class="btn-primary">Oyuna Başla</button>
        <button id="restartBtn" class="btn-primary">Yeniden Başlat</button>
    </div>

    <div class="d-pad">
        <button id="btnUp">⬆️</button>
        <div class="horizontal-btns">
            <button id="btnLeft">⬅️</button>
            <button id="btnRight">➡️</button>
        </div>
        <button id="btnDown">⬇️</button>
    </div>

    <script>
        // Tüm kodu sayfa yüklendikten sonra çalışması için sarmaladık
        document.addEventListener("DOMContentLoaded", () => {
            
            const canvas = document.getElementById("gameBoard");
            const ctx = canvas.getContext("2d");
            const scoreText = document.getElementById("scoreText");
            const highScoreText = document.getElementById("highScoreText");
            const pointsText = document.getElementById("pointsText");
            const startBtn = document.getElementById("startBtn");
            const restartBtn = document.getElementById("restartBtn");

            const boardBackground = "#34495e";
            const snakeColor = "#2ecc71";
            const snakeBorder = "#27ae60";
            const foodColor = "#e74c3c";
            const unitSize = 20;

            let running = false;
            
            const baseSpeed = 250; 
            const minSpeed = 50;   
            const speedStep = 10;  
            let gameSpeed = baseSpeed; 
            
            let xVelocity = unitSize;
            let yVelocity = 0;
            let foodX;
            let foodY;
            let score = 0;
            let highScore = 0;

            // Güvenli skor çekme bloğu
            try {
                if (window.localStorage) {
                    highScore = localStorage.getItem("snakeHighScore") || 0; 
                }
            } catch (error) {
                console.warn("Lokal dosya engeli: Rekor kaydedilemiyor.");
            }

            let snake = [
                {x: unitSize * 4, y: 0},
                {x: unitSize * 3, y: 0},
                {x: unitSize * 2, y: 0},
                {x: unitSize, y: 0},
                {x: 0, y: 0}
            ];

            // Tıklama olaylarını HTML'den değil doğrudan buradan yakalıyoruz
            startBtn.addEventListener("click", startGame);
            restartBtn.addEventListener("click", resetGame);
            
            document.getElementById("btnUp").addEventListener("click", () => setDirection('UP'));
            document.getElementById("btnDown").addEventListener("click", () => setDirection('DOWN'));
            document.getElementById("btnLeft").addEventListener("click", () => setDirection('LEFT'));
            document.getElementById("btnRight").addEventListener("click", () => setDirection('RIGHT'));

            window.addEventListener("keydown", changeDirection);
            
            // Oyunu ekranda hazırla
            initGame();

            function initGame() {
                highScoreText.textContent = highScore;
                clearBoard();
                ctx.font = "20px 'Segoe UI'";
                ctx.fillStyle = "#ecf0f1";
                ctx.textAlign = "center";
                ctx.fillText("Başlamak için", canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillText("'Oyuna Başla'ya basın", canvas.width / 2, canvas.height / 2 + 15);
            }

            function startGame() {
                if(running) return;
                startBtn.style.display = "none";
                restartBtn.style.display = "none";
                running = true;
                scoreText.textContent = score;
                updatePointsUI();
                createFood();
                nextTick();
            }

            function nextTick() {
                if(running) {
                    setTimeout(() => {
                        clearBoard();
                        drawFood();
                        moveSnake();
                        drawSnake();
                        checkGameOver();
                        nextTick();
                    }, gameSpeed); 
                } else {
                    displayGameOver();
                }
            };

            function clearBoard() {
                ctx.fillStyle = boardBackground;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            };

            function createFood() {
                function randomFood(min, max) {
                    return Math.round((Math.random() * (max - min) + min) / unitSize) * unitSize;
                }
                
                let foodIsOnSnake = true;
                while(foodIsOnSnake) {
                    foodX = randomFood(0, canvas.width - unitSize);
                    foodY = randomFood(0, canvas.height - unitSize);
                    
                    foodIsOnSnake = snake.some(snakePart => snakePart.x === foodX && snakePart.y === foodY);
                }
            };

            function drawFood() {
                ctx.fillStyle = foodColor;
                ctx.fillRect(foodX, foodY, unitSize, unitSize);
            };
            
            function calculateCurrentPoints() {
                return Math.floor((baseSpeed - gameSpeed) / speedStep) + 1;
            }

            function updatePointsUI() {
                pointsText.textContent = calculateCurrentPoints();
            }

            function moveSnake() {
                let newX = snake[0].x + xVelocity;
                let newY = snake[0].y + yVelocity;

                if (newX < 0) newX = canvas.width - unitSize;
                else if (newX >= canvas.width) newX = 0;
                
                if (newY < 0) newY = canvas.height - unitSize;
                else if (newY >= canvas.height) newY = 0;

                const head = {x: newX, y: newY};
                snake.unshift(head);
                
                if(snake[0].x == foodX && snake[0].y == foodY) {
                    score += calculateCurrentPoints();
                    scoreText.textContent = score;
                    
                    if(gameSpeed > minSpeed) {
                        gameSpeed -= speedStep;
                    }
                    
                    updatePointsUI(); 
                    
                    if (score > highScore) {
                        highScore = score;
                        highScoreText.textContent = highScore;
                        
                        try {
                            if (window.localStorage) {
                                localStorage.setItem("snakeHighScore", highScore);
                            }
                        } catch (error) {
                            // Sessizce hatayı atla
                        }
                    }
                    createFood();
                } else {
                    snake.pop(); 
                }
            };

            function drawSnake() {
                ctx.fillStyle = snakeColor;
                ctx.strokeStyle = snakeBorder;
                snake.forEach(snakePart => {
                    ctx.fillRect(snakePart.x, snakePart.y, unitSize, unitSize);
                    ctx.strokeRect(snakePart.x, snakePart.y, unitSize, unitSize);
                });
            };

            function setDirection(direction) {
                const goingUp = (yVelocity == -unitSize);
                const goingDown = (yVelocity == unitSize);
                const goingRight = (xVelocity == unitSize);
                const goingLeft = (xVelocity == -unitSize);

                if(direction == 'LEFT' && !goingRight) { xVelocity = -unitSize; yVelocity = 0; }
                if(direction == 'UP' && !goingDown) { xVelocity = 0; yVelocity = -unitSize; }
                if(direction == 'RIGHT' && !goingLeft) { xVelocity = unitSize; yVelocity = 0; }
                if(direction == 'DOWN' && !goingUp) { xVelocity = 0; yVelocity = unitSize; }
            }

            function changeDirection(event) {
                const keyPressed = event.keyCode;
                
                if(keyPressed == 37 || keyPressed == 65) setDirection('LEFT');   
                if(keyPressed == 38 || keyPressed == 87) setDirection('UP');     
                if(keyPressed == 39 || keyPressed == 68) setDirection('RIGHT');  
                if(keyPressed == 40 || keyPressed == 83) setDirection('DOWN');   
                
                if([37, 38, 39, 40].includes(keyPressed)) {
                    event.preventDefault(); 
                }
            };

            function checkGameOver() {
                for(let i = 1; i < snake.length; i+=1) {
                    if(snake[i].x == snake[0].x && snake[i].y == snake[0].y) {
                        running = false;
                    }
                }
            };

            function displayGameOver() {
                ctx.font = "40px 'Segoe UI'";
                ctx.fillStyle = "#e74c3c";
                ctx.textAlign = "center";
                ctx.fillText("OYUN BİTTİ!", canvas.width / 2, canvas.height / 2);
                restartBtn.style.display = "block"; 
                running = false;
            };

            function resetGame() {
                score = 0;
                gameSpeed = baseSpeed; 
                xVelocity = unitSize;
                yVelocity = 0;
                snake = [
                    {x: unitSize * 4, y: 0},
                    {x: unitSize * 3, y: 0},
                    {x: unitSize * 2, y: 0},
                    {x: unitSize, y: 0},
                    {x: 0, y: 0}
                ];
                startGame();
            };
        });
    </script>
</body>
</html>
